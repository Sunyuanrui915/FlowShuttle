name: "BUG 反馈 / Bug report"
description: "报告可以复现的问题 / Report a reproducible problem"
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。GitHub Issue 是公开内容，请不要提交数据库、API Key、授权码或真实工作内容；涉及隐私的材料请使用流梭“设置 > 发送反馈”。

        Thank you for reporting a problem. GitHub Issues are public. Do not include databases, API keys, authorization codes, or private work content. Use Settings > Send Feedback for private material.

  - type: input
    id: version
    attributes:
      label: "流梭版本 / Flow Shuttle version"
      description: "可在应用左下角或设置页查看。"
      placeholder: "例如 / Example: v0.4.3"
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: "Windows 版本 / Windows version"
      options:
        - Windows 11
        - Windows 10
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "问题描述 / Problem"
      description: "发生了什么？请只填写定位问题所需的信息。"
      placeholder: "简要描述问题出现的位置和现象。"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤 / Steps to reproduce"
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "预期结果 / Expected behavior"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "实际结果 / Actual behavior"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "出现频率 / Frequency"
      options:
        - 每次都出现 / Every time
        - 偶尔出现 / Sometimes
        - 只出现过一次 / Once
        - 不确定 / Unsure
    validations:
      required: true

  - type: dropdown
    id: data-impact
    attributes:
      label: "本地数据影响 / Local data impact"
      options:
        - 没有发现数据影响 / No data impact observed
        - 无法保存或读取 / Unable to save or read
        - 疑似丢失或覆盖 / Possible loss or overwrite
        - 不确定 / Unsure
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "截图或补充信息 / Screenshots or additional context"
      description: "选填。可直接粘贴脱敏截图；请先遮盖私人内容。"

  - type: checkboxes
    id: privacy
    attributes:
      label: "隐私确认 / Privacy confirmation"
      options:
        - label: "我已确认本 Issue 不包含数据库、API Key、授权码或未脱敏的工作内容。"
          required: true
