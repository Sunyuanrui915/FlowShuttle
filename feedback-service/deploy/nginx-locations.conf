# Include this file only from the HTTPS server block for sunyuanrui.com.
location = /api/flow-shuttle/feedback {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 27m;
    client_body_timeout 30s;
    limit_req zone=flow_feedback_submit burst=4 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }

    proxy_pass http://127.0.0.1:17832;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 45s;
    proxy_read_timeout 45s;
    proxy_request_buffering on;
}

location ^~ /api/flow-shuttle/feedback/screenshots/ {
    access_log off;
    error_log /dev/null crit;
    limit_req zone=flow_feedback_image burst=12 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }

    proxy_pass http://127.0.0.1:17832;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
}
